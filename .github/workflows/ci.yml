name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn matplotlib pytest ruff
      - uses: actions/cache@v4
        with:
          path: ~/scikit_learn_data
          key: sklearn-data-california-housing
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
